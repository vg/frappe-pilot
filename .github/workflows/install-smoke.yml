name: Install Script Smoke Tests

on:
  pull_request:
    branches: [develop]
    paths:
      - install.sh
      - scripts/smoke_install.sh
      - scripts/smoke_install_macos.sh
      - .github/workflows/install-smoke.yml
  workflow_dispatch:

jobs:
  shellcheck:
    runs-on: ubuntu-slim
    steps:
      - uses: actions/checkout@v4

      - name: Lint install.sh
        run: shellcheck -s sh install.sh

      - name: Lint smoke test script
        run: shellcheck scripts/smoke_install.sh

      - name: Lint macOS smoke test script
        run: shellcheck scripts/smoke_install_macos.sh

  smoke-x64:
    needs: shellcheck
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        image:
          - almalinux:8
          - almalinux:9
          - almalinux:10
          - rockylinux/rockylinux:8
          - rockylinux/rockylinux:9
          - rockylinux/rockylinux:10
          - debian:12
          - debian:13
          - debian:sid
          - ubuntu:22.04
          - ubuntu:24.04
          - ubuntu:26.04
          - ubuntu:26.10
          - fedora:40
          - fedora:41
          - fedora:42
          - fedora:43
          - fedora:44
          - archlinux:latest
    steps:
      - uses: actions/checkout@v4

      - name: Run install.sh inside ${{ matrix.image }}
        run: ./scripts/smoke_install.sh "${{ matrix.image }}"

  smoke-arm:
    needs: shellcheck
    runs-on: ubuntu-26.04-arm
    strategy:
      fail-fast: false
      matrix:
        image:
          - almalinux:8
          - almalinux:9
          - almalinux:10
          - rockylinux/rockylinux:8
          - rockylinux/rockylinux:9
          - rockylinux/rockylinux:10 
          - debian:12
          - debian:13
          - debian:sid
          - ubuntu:22.04
          - ubuntu:24.04
          - ubuntu:26.04
          - ubuntu:26.10
          - fedora:40
          - fedora:41
          - fedora:42
          - fedora:43
          - fedora:44
    steps:
      - uses: actions/checkout@v4

      - name: Run install.sh inside ${{ matrix.image }}
        run: ./scripts/smoke_install.sh "${{ matrix.image }}"

  smoke-mac:
    needs: shellcheck
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [macos-14, macos-15, macos-26]
    steps:
      - uses: actions/checkout@v4

      - name: Run install.sh on macOS
        run: ./scripts/smoke_install_macos.sh
